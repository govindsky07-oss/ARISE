<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arise</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arise">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Layout: single-column HUD. Orb + controls on top, optional video, transcript in the middle, input bar at the bottom. */
:root{
  --bg:#050a12; --panel:#0b1422; --line:#17304a; --fg:#d8f3ff; --dim:#6f93ab;
  --cyan:#3ee0ff; --amber:#ffb23e; --danger:#ff7b7b; --live:var(--cyan);
  --display:'Rajdhani',system-ui,sans-serif; --mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 70% at 50% 0%,#0a1d33 0,var(--bg) 60%) var(--bg);
  color:var(--fg); font:500 17px/1.45 var(--display);
  display:flex; flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
}
body[data-state=listening]{--live:var(--amber)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:22px;letter-spacing:.35em;font-weight:700;color:var(--cyan)}
.tiny{font:12px var(--mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
button,input,select,textarea{font:inherit;color:inherit}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font:13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.ghost:hover,.ghost:focus-visible{border-color:var(--cyan);color:var(--cyan);outline:none}
.ghost[aria-pressed=true]{border-color:var(--amber);color:var(--amber);box-shadow:0 0 14px rgba(255,178,62,.35)}

.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 4px}
.orb{position:relative;width:min(40vw,160px);aspect-ratio:1;border:0;background:none;cursor:pointer;padding:0;border-radius:50%;transition:width .3s}
body.has-video .orb{width:96px}
.orb:focus-visible{outline:2px solid var(--live);outline-offset:6px}
.orb i{position:absolute;border-radius:50%;display:block}
.orb i:nth-child(1){inset:0;border:2px dashed var(--live);opacity:.55;animation:spin 24s linear infinite}
.orb i:nth-child(2){inset:12%;border:6px solid var(--line);border-top-color:var(--live);border-bottom-color:var(--live);animation:spin 7s linear infinite reverse}
.orb i:nth-child(3){inset:30%;background:radial-gradient(circle,var(--live) 0,rgba(62,224,255,.12) 72%);box-shadow:0 0 44px var(--live);animation:breathe 3.2s ease-in-out infinite}
body[data-state=thinking] .orb i:nth-child(2){animation-duration:1.2s}
body[data-state=listening] .orb i:nth-child(3){animation-duration:.9s}
body[data-state=speaking] .orb i:nth-child(3){animation-duration:.6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.14);opacity:.8}}
#status{min-height:1.4em;text-align:center;max-width:100%;overflow-wrap:anywhere}
.lvl{width:min(260px,60vw);height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--live);transition:width .08s}
#heard{font:12px var(--mono);color:var(--dim);min-height:1.3em;max-width:100%;overflow-wrap:anywhere;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;max-width:100%;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--cyan);outline:none}

.playerbox{width:100%;max-width:560px;margin:6px auto 0;display:flex;flex-direction:column;gap:6px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#vtitle{flex:1 1 160px;min-width:0;font-size:14px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px}
.msg{max-width:88%;padding:9px 13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;border-color:#25507a}
.msg.ai{align-self:flex-start;border-left:3px solid var(--cyan)}
.msg.sys{align-self:center;font:13px var(--mono);color:var(--dim);background:none;border:0;text-align:center}
.msg.err{color:var(--danger)}
.msg.act{align-self:flex-start;font:13px var(--mono);color:var(--cyan);background:none;border:1px dashed var(--line)}
.msg a{color:var(--cyan)}
.copy{display:block;margin-top:8px}

form{display:flex;gap:8px;padding-top:8px}
form input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
form input:focus-visible{outline:none;border-color:var(--cyan)}
.send{background:var(--cyan);color:#021018;border:0;border-radius:8px;padding:0 18px;font-weight:700;letter-spacing:.08em;cursor:pointer}

#settings{position:fixed;inset:0;background:rgba(2,6,12,.86);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.card{width:min(460px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:20px;letter-spacing:.2em;color:var(--cyan)}
label{display:flex;flex-direction:column;gap:5px}
label.row{flex-direction:row;align-items:center;gap:10px}
.card input[type=password],.card input[type=text],.card select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
.card a{color:var(--cyan)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.alarmbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--amber);border-radius:10px;color:var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 18px rgba(255,178,62,.55)}}
#alarmlist{font:12px var(--mono);color:var(--dim);text-align:center;overflow-wrap:anywhere}
.card .crow{display:flex;gap:6px;flex-wrap:wrap}
.card .crow input{flex:1 1 120px;min-width:0;width:auto}
.citem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.citem span{min-width:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.orb i,.alarmbar{animation:none!important}}
</style>
</head>
<body data-state="idle">
<header>
  <h1>ARISE</h1>
  <button class="ghost" id="open-settings" type="button">Settings</button>
</header>

<section class="stage">
  <button class="orb" id="orb" type="button" aria-label="Ek baar bolne ke liye dabao"><i></i><i></i><i></i></button>
  <div id="status" class="tiny">Orb dabao aur bolo</div>
  <div class="lvl" aria-hidden="true"><i id="lvlbar"></i></div>
  <div id="heard"></div>
  <div id="alarmbar" class="alarmbar" hidden><span id="alarmtext"></span><button class="ghost" id="alarm-stop" type="button">Alarm band karo</button></div>
  <div id="alarmlist"></div>
  <button class="ghost" id="hands" type="button" aria-pressed="false">Hands-free: OFF</button>
  <div class="chips" id="chips"></div>
</section>

<section class="playerbox" id="playerbox" hidden>
  <div class="player" id="ytwrap"></div>
  <div class="vbar">
    <span id="vtitle"></span>
    <button class="ghost" id="v-play" type="button">Play/Pause</button>
    <button class="ghost" id="v-back" type="button">-10s</button>
    <button class="ghost" id="v-fwd" type="button">+10s</button>
    <button class="ghost" id="v-sound" type="button">Sound ON</button>
    <button class="ghost" id="v-close" type="button">Band</button>
  </div>
</section>

<main id="log" aria-live="polite"></main>

<form id="form" autocomplete="off">
  <input id="text" type="text" placeholder="Ya yahan type karo..." aria-label="Message">
  <button class="send" type="submit">SEND</button>
</form>

<div id="settings" hidden>
  <div class="card" role="dialog" aria-label="Settings">
    <h2>SETTINGS</h2>
    <label>Gemini API key
      <input id="key" type="password" placeholder="AIza..." autocomplete="off">
      <span class="tiny">Free key: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Key sirf is browser mein save hoti hai.</span>
    </label>
    <label>Model
      <input id="model" type="text" value="gemini-flash-latest">
      <span class="tiny">Busy hone par Arise apne aap dusre model try karta hai.</span>
    </label>
    <label>YouTube API key (optional)
      <input id="ytkey" type="password" placeholder="AIza..." autocomplete="off">
      <span class="tiny">Channel ka asli sabse zyada views wala video chalane ke liye. Bina iske Arise Gemini search se andaaza lagata hai.</span>
    </label>
    <label>Bolne ki bhasha (Chrome/Android)
      <select id="lang">
        <option value="hi-IN">Hindi / Hinglish (hi-IN)</option>
        <option value="en-IN">English India (en-IN)</option>
        <option value="en-US">English US (en-US)</option>
      </select>
    </label>
    <label class="row"><input id="rec" type="checkbox"> Gemini se awaaz samjho (iPad/iPhone ke liye zaroori)</label>
    <label class="row"><input id="speak" type="checkbox" checked> Jawab bolke sunao</label>
    <label class="row"><input id="duck" type="checkbox" checked> Baat karte waqt video pause karo</label>
    <div class="contacts">
      <span class="tiny">Contacts (call aur WhatsApp ke liye)</span>
      <div class="crow">
        <input id="c-name" type="text" placeholder="Naam (jaise Mummy)" autocomplete="off">
        <input id="c-num" type="text" inputmode="tel" placeholder="Number (jaise 9876543210)" autocomplete="off">
        <button class="ghost" id="c-add" type="button">Add</button>
      </div>
      <span id="c-msg" class="tiny"></span>
      <div id="c-list"></div>
    </div>
    <div class="actions">
      <button class="ghost" id="clear" type="button">Chat saaf karo</button>
      <button class="ghost" id="clear-mem" type="button">Yaaddasht bhulo</button>
      <button class="ghost" id="save" type="button">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  var store = {
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  function jget(k,d){ try{ var v = JSON.parse(store.get(k,'')); return v==null?d:v; }catch(e){ return d; } }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  var DEFAULT_MODEL = 'gemini-flash-latest';
  if(store.get('jv_model','') === 'gemini-2.5-flash') store.set('jv_model', DEFAULT_MODEL);
  function recMode(){
    var f = store.get('jv_record','');
    if(f === '1') return true;
    if(f === '0') return !SR;
    return !SR || IOS;
  }

  var history = [], busy = false, speaking = false, quietUntil = 0, hands = false;
  var awaitUntil = 0, wakeLock = null, rec = null, L = null, calls = [];
  var videoPausedByUs = false, videoTouched = false, speechUnlocked = false;
  var alarms = [], ringing = null, ringMute = 0, batt = null, battFired = false, AUD = null;
  var battThr = +store.get('jv_batt','0') || 0;
  var STOPRE = /\b(band|stop|bas|chup|ruk|ruko|shant|off)\b|बंद|रुको|बस|चुप/i;
  var WAKE = /\b(arise|a rise|arize|ariz|arice|aries|arais|erise)\b|अराइज़?|अराईज़?|अराइस|एराइज़?|अरेज़?/i;

  /* ---------- prompt ---------- */
  function nowString(){
    return new Date().toLocaleString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'});
  }
  function systemText(){
    var prof = jget('jv_profile', []);
    return 'Tum "Arise" ho: user ka personal voice assistant (Jarvis jaisa), smart, tez aur friendly. ' +
      'User jis bhasha mein bole usi mein jawab do (Hinglish ho toh Roman Hinglish).\n' +
      'Niyam:\n' +
      '- Jab user koi kaam bole (video chalana, search, maps, WhatsApp, call, email, timer, notes, mausam, hisaab) toh tools use karo. Bina tool chalaye kabhi mat kehna ki kaam ho gaya.\n' +
      '- Aaj ki khabar, score, price ya koi bhi latest jaankari ke liye web_lookup use karo. Andaaza mat lagao.\n' +
      '- "Kisi channel ka viral ya sabse zyada views wala video chalao" ke liye play_youtube_video use karo (channel set karo, sort=viral). "Naya video" ke liye sort=latest. Gaana ya topic ke liye query set karo.\n' +
      '- Video ka script, caption ya idea maangne par write_script use karo. Wo poora script screen par likh deta hai.\n' +
      '- User apne baare mein kuch bataye (naam, pasand, kaam) toh remember_about_me use karo.\n' +
      '- Jawab bolke sunaya jayega. Pehle 1 se 2 chhote vaakya mein seedha jawab ya confirmation do. Lambi cheez maangi gayi ho toh detail mein likh sakte ho, par sirf shuruaat ke vaakya sunaye jayenge.\n' +
      '- Markdown (*, #, backticks) aur emoji mat use karo.\n' +
      '- Zaroori jaankari na ho (jaise phone number) toh ek chhota sawal poochho.\n' +
      '- Alarm ke liye set_alarm (time 24-ghante HH:MM mein), timer ke liye set_timer, band karne ke liye stop_alarm. Alarm tabhi bajta hai jab Arise ka page khula ho.\n' +
      '- Battery ke liye set_battery_alert (jaise 80 percent). Agar tool bataye ki browser support nahi karta toh seedha wahi bata do.\n' +
      '- Viral ideas maange toh find_viral_ideas use karo (5 ideas aur sabse achhe ka script screen par aayega). User ke channel ka niche pata ho toh wahi use karo, nahi pata toh ek chhota sawal poochho aur remember_about_me se yaad rakho.\n' +
      '- WhatsApp par aaye hue messages padhna ya unka jawab dena Arise nahi kar sakta. User pooche toh saaf bata do aur iPhone/iPad ka Siri "Announce Notifications" suggest karo. Message bhejne ke liye whatsapp_message use karo (user ko send dabana hota hai).\n' +
      (Object.keys(getContacts()).length ? 'Saved contacts (naam): ' + Object.keys(getContacts()).join(', ') + '. User koi aur naam bole (jaise Mom) toh sabse milta naam chuno.\n' : '') +
      'Abhi ka samay (India): ' + nowString() + '.' +
      (prof.length ? '\nUser ke baare mein jo pata hai: ' + prof.join('; ') + '.' : '');
  }

  /* ---------- UI helpers ---------- */
  function setState(s, text){ document.body.dataset.state = s; if(text) $('#status').textContent = text; }
  function setHeard(t){ $('#heard').textContent = t ? ('Suna: ' + t) : ''; }
  function statusIdle(){
    if(hands) setState('listening','Hands-free on: "Arise" bolo...');
    else setState('idle','Ready. Orb dabao aur bolo');
  }
  function copyText(text, btn){
    function done(){ btn.textContent = 'Copy ho gaya'; setTimeout(function(){ btn.textContent = 'Copy'; }, 1500); }
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback();
  }
  function add(kind, text){
    var d = document.createElement('div'); d.className = 'msg ' + kind; d.textContent = text;
    if(kind === 'ai' && text.length > 350){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'ghost copy'; b.textContent = 'Copy';
      b.addEventListener('click', function(){ copyText(text, b); });
      d.appendChild(b);
    }
    $('#log').appendChild(d); $('#log').scrollTop = $('#log').scrollHeight; return d;
  }
  function openLink(label, url){
    var d = add('sys', label + ' ');
    var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Kholo';
    d.appendChild(a);
    try{ window.open(url, '_blank', 'noopener'); }catch(e){}
    $('#log').scrollTop = $('#log').scrollHeight;
  }
  function getAudio(){
    if(AUD) return AUD;
    var C = window.AudioContext || window.webkitAudioContext; if(!C) return null;
    try{ AUD = new C(); }catch(e){ AUD = null; }
    return AUD;
  }
  function unlockAudio(){
    var c = getAudio(); if(!c) return;
    try{
      if(c.state === 'suspended') c.resume();
      var b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0);
    }catch(e){}
  }
  function tone(count){
    try{
      var c = getAudio(); if(!c) return;
      if(c.state === 'suspended') c.resume();
      var t = 0;
      for(var i=0;i<count;i++){
        var o = c.createOscillator(), g = c.createGain(), len = count > 1 ? 0.2 : 0.12, st = c.currentTime + t;
        o.frequency.value = count > 1 ? 880 : 1180; o.connect(g); g.connect(c.destination);
        g.gain.setValueAtTime(0.3, st); g.gain.setValueAtTime(0, st + len);
        o.start(st); o.stop(st + len + 0.03); t += 0.4;
      }
    }catch(e){}
  }
  function beep(){ tone(4); }
  function ding(){ tone(1); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  /* ---------- Gemini (with retry + model fallback) ---------- */
  function modelList(first){
    var m = first || store.get('jv_model', DEFAULT_MODEL) || DEFAULT_MODEL;
    var l = [m, 'gemini-flash-latest', 'gemini-flash-lite-latest'];
    return l.filter(function(x,i){ return x && l.indexOf(x) === i; });
  }
  async function gemini(body, models){
    var key = store.get('jv_key','');
    if(!key){ $('#settings').hidden = false; throw new Error('Pehle Settings mein Gemini API key daalo.'); }
    var list = models || modelList(), lastErr = null;
    for(var round=0; round<2; round++){
      for(var i=0;i<list.length;i++){
        var res, data;
        try{
          res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(list[i]) + ':generateContent', {
            method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key}, body:JSON.stringify(body)
          });
          data = await res.json().catch(function(){return {}});
        }catch(e){ lastErr = new Error('Internet ki dikkat. Connection check karke dobara bolo.'); continue; }
        if(res.ok) return data;
        var msg = (data.error && data.error.message) || ('Error ' + res.status);
        lastErr = new Error(msg); lastErr.status = res.status;
        if(res.status === 400 || res.status === 401 || res.status === 403) throw lastErr;
      }
      await sleep(1500);
    }
    throw lastErr;
  }
  function friendly(e){
    var m = (e && e.message) || String(e), s = e && e.status;
    if(/api key/i.test(m)) return 'API key galat hai. Settings mein sahi key daalo.';
    if(s === 429 || /quota|rate limit|resource exhausted/i.test(m)) return 'Gemini ki free limit abhi poori hai. 1 minute ruk ke dobara try karo.';
    if(s === 503 || /high demand|overloaded|unavailable/i.test(m)) return 'Gemini abhi busy hai. Thodi der baad dobara bolo.';
    return m;
  }
  function textOf(data){
    var parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    return parts.map(function(p){ return p.text || ''; }).join('').trim();
  }

  /* ---------- YouTube in the page ---------- */
  var ytPlayer = null, ytIsReady = false, pendingVid = null, ytApiState = 0, ytQueue = null;
  function ensureYT(cb){
    if(window.YT && YT.Player){ cb(); return; }
    ytQueue = cb;
    if(ytApiState === 0){
      ytApiState = 1;
      window.onYouTubeIframeAPIReady = function(){ ytApiState = 2; if(ytQueue){ var f = ytQueue; ytQueue = null; f(); } };
      var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = function(){ ytApiState = 0; add('sys err','YouTube player load nahi hua. Internet check karo.'); };
      document.head.appendChild(s);
    }
  }
  function showVideo(id, title){
    $('#playerbox').hidden = false; document.body.classList.add('has-video');
    $('#vtitle').textContent = title || '';
    ensureYT(function(){
      if(ytPlayer){ if(ytIsReady) ytPlayer.loadVideoById(id); else pendingVid = id; return; }
      $('#ytwrap').innerHTML = '<div id="ytbox"></div>';
      ytIsReady = false;
      ytPlayer = new YT.Player('ytbox', {
        videoId:id, width:'100%', height:'100%',
        playerVars:{autoplay:1, mute:1, playsinline:1, rel:0, origin:location.origin},
        events:{
          onReady:function(e){
            ytIsReady = true;
            try{ if(pendingVid){ e.target.loadVideoById(pendingVid); pendingVid = null; } else e.target.playVideo(); }catch(x){}
          },
          onStateChange:function(e){
            if(e.data === 1){ try{ e.target.unMute(); }catch(x){} }
          },
          onError:function(e){

  async function viaYtApi(a, sort, key){

    if(a.channel){

  async function viaGemini(a, sort){
    var what = sort === 'viral' ? 'sabse zyada views wala (sabse viral)' : (sort === 'latest' ? 'sabse naya (latest)' : 'sabse relevant');
    var subject = (a.channel ? '"' + a.channel + '" YouTube channel ka ' : '') + (a.query ? '"' + a.query + '" topic ka ' : '') + what + ' video';
    var data = await gemini({
      contents:[{role:'user',parts:[{text:'Google search se dhoondo: ' + subject + '. Sirf ek line mein is format mein jawab do: VIDEOID | video ka title | channel ka naam. VIDEOID YouTube watch?v= ke baad wala exactly 11 akshar ka id hona chahiye. Pakka na mile toh sirf likho: NONE'}]}],
      tools:[{google_search:{}}]

    var m = t.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/) || t.match(/^\s*([A-Za-z0-9_-]{11})\s*\|/m);

  async function ask(text){
    var turn = history.slice(-16).concat([{role:'user',parts:[{text:text}]}]);
    for(var i=0;i<6;i++){
      var data = await gemini({systemInstruction:{parts:[{text:systemText()}]}, contents:turn, tools:TOOLS});
      var parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      var fcalls = parts.filter(function(p){ return p.functionCall; });
      if(!fcalls.length){
        var reply = parts.map(function(p){ return p.text || ''; }).join('').trim();
        if(!reply) throw new Error('Gemini ne koi jawab nahi diya. Dobara try karo.');
        history.push({role:'user',parts:[{text:text}]}, {role:'model',parts:[{text:reply}]});
        while(history.length > 24) history.splice(0, 2);
        return reply;
      }
      turn.push({role:'model',parts:parts});
      var out = [];
      for(var j=0;j<fcalls.length;j++){
        var c = fcalls[j].functionCall;
        out.push({functionResponse:{name:c.name, response:await runTool(c.name, c.args)}});
      }
      turn.push({role:'user',parts:out});
    }
    return 'Kaam poora nahi ho paya, dobara bolo.';
  }

  /* ---------- speech out ---------- */
  function unlockSpeech(){
    unlockAudio();
    if(speechUnlocked || !window.speechSynthesis) return;
    speechUnlocked = true;
    try{ var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
  }
  function spokenPart(text){
    var t = String(text).replace(/https?:\/\/\S+/g,'').replace(/[*_`#>]/g,'').trim();
    if(t.length <= 300) return t;
    var cut = t.slice(0, 300), k = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('? '), cut.lastIndexOf('! '), cut.lastIndexOf('।'));
    if(k < 80) k = cut.lastIndexOf(' ');
    if(k < 1) k = 299;
    return cut.slice(0, k + 1).trim() + ' Baaki poora jawab screen par hai.';
  }
  function speak(text){
    return new Promise(function(resolve){
      var t = spokenPart(text);
      if(store.get('jv_speak','1') !== '1' || !window.speechSynthesis || !t){ resolve(); return; }
      stopRec();
      speaking = true;
      var u = new SpeechSynthesisUtterance(t);
      u.lang = /[ऀ-ॿ]/.test(t) ? 'hi-IN' : 'en-IN';
      var vs = speechSynthesis.getVoices(), pick = null, i;
      for(i=0;i<vs.length;i++){ if(vs[i].lang.replace('_','-') === u.lang){ pick = vs[i]; break; } }
      if(!pick){ for(i=0;i<vs.length;i++){ if(vs[i].lang.slice(0,2) === u.lang.slice(0,2)){ pick = vs[i]; break; } } }
      if(pick) u.voice = pick;
      var done = false;
      function fin(){ if(done) return; done = true; speaking = false; quietUntil = Date.now() + 700; resolve(); }
      u.onstart = function(){ setState('speaking','Bol raha hoon...'); };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 3000 + t.length * 150);
      try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ fin(); }
    });
  }

  function idleOrHands(){
    if(hands){
      if(recMode()){ if(!L) startListener(false); statusIdle(); }
      else { setState('idle','Hands-free on: "Arise" bolo'); if(!rec && !speaking) startRec(true); }
    } else statusIdle();
  }
  async function handle(text){
    text = (text||'').trim();
    if(text && ringing && STOPRE.test(text)){
      stopAlarm(); add('me', text); add('ai','Alarm band kar diya.'); statusIdle(); return;
    }
    if(!text || busy) return;
    busy = true; awaitUntil = 0; stopRec(); duck();
    add('me', text); setState('thinking','Soch raha hoon...');
    try{
      var reply = await ask(text);
      add('ai', reply);
      await speak(reply);
    }catch(e){
      add('sys err', friendly(e));
    }
    busy = false; unduck(); idleOrHands();
  }

  function routeTranscript(t){
    if(ringing && STOPRE.test(t)){ handle(t); return; }
    var m = t.match(WAKE);
    if(m){
      var before = t.slice(0, m.index), after = t.slice(m.index + m[0].length);
      var cmd = after.trim().replace(/^[\s,.\-!?]+/, '');
      if(cmd.length < 2){
        var b = before.trim().replace(/[\s,.\-!?]+$/, '');
        if(b.length > 3 && !/^(hey|hi|hello|ok|okay|oye|are|arre)$/i.test(b)) cmd = b; else cmd = '';
      }
      ding();
      if(cmd.length >= 2){ handle(cmd); }
      else {
        awaitUntil = Date.now() + 8000; setState('listening','Haan bolo...');
        setTimeout(function(){ if(Date.now() >= awaitUntil && !busy) statusIdle(); }, 8200);
      }
      return;
    }
    if(Date.now() < awaitUntil){ awaitUntil = 0; handle(t); }
  }

  /* ---------- listening: Chrome speech recognition ---------- */
  function stopRec(){ if(rec){ var r = rec; rec = null; try{ r.onend = null; r.abort(); }catch(e){} } }
  function startRec(continuous){
    if(!SR){ startListener(!continuous); return; }
    stopRec();
    var r = new SR(); rec = r;
    r.lang = store.get('jv_lang','hi-IN');
    r.continuous = continuous; r.interimResults = !continuous;
    var finalText = '';
    r.onstart = function(){ setState('listening', continuous ? 'Hands-free on: "Arise" bolo...' : 'Sun raha hoon...'); };
    r.onresult = function(e){
      var interim = '';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var res = e.results[i], t = res[0].transcript;
        if(!res.isFinal){ interim += t; continue; }
        if(!continuous){ finalText += t; continue; }
        setHeard(t); routeTranscript(t);
      }
      if(!continuous) $('#status').textContent = (finalText + interim) || 'Sun raha hoon...';
    };
    r.onerror = function(e){
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        store.set('jv_record','1'); rec = null;
        add('sys','Is device ka voice recognition band hai. Gemini wala tarika on kar diya hai.');
        if(hands) startListener(false); else startListener(true);
      } else if(e.error !== 'no-speech' && e.error !== 'aborted'){
        add('sys err','Voice error: ' + e.error);
      }
    };
    r.onend = function(){
      if(rec !== r) return;
      rec = null;
      if(continuous){
        if(hands && !speaking && !busy) setTimeout(function(){ if(hands && !rec && !speaking && !busy) startRec(true); }, 350);
      } else {
        if(document.body.dataset.state === 'listening') statusIdle();
        if(finalText.trim()) handle(finalText);
      }
    };
    try{ r.start(); }catch(e){ rec = null; statusIdle(); }
  }

  /* ---------- listening: record audio, Gemini turns it into text ---------- */
  function toWav16k(chunks, rate){
    var total = 0, i, j;
    for(i=0;i<chunks.length;i++) total += chunks[i].length;
    var all = new Float32Array(total), off = 0;
    for(i=0;i<chunks.length;i++){ all.set(chunks[i], off); off += chunks[i].length; }
    var ratio = rate / 16000, outLen = Math.floor(total / ratio);
    var pcm = new Int16Array(outLen);
    for(i=0;i<outLen;i++){
      var a = Math.floor(i * ratio), b = Math.min(total, Math.floor((i + 1) * ratio)), sum = 0, n = 0;
      for(j=a;j<b;j++){ sum += all[j]; n++; }
      var v = n ? sum / n : 0;
      v = Math.max(-1, Math.min(1, v));
      pcm[i] = v < 0 ? v * 32768 : v * 32767;
    }
    var buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
    function str(o, t){ for(var k=0;k<t.length;k++) dv.setUint8(o + k, t.charCodeAt(k)); }
    str(0,'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); str(8,'WAVE'); str(12,'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    str(36,'data'); dv.setUint32(40, pcm.length * 2, true);
    for(i=0;i<pcm.length;i++) dv.setInt16(44 + i * 2, pcm[i], true);
    return new Uint8Array(buf);
  }
  function toBase64(bytes){
    var bin = '', step = 0x8000;
    for(var i=0;i<bytes.length;i+=step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    return btoa(bin);
  }
  async function transcribe(b64){
    var data = await gemini({contents:[{role:'user',parts:[
      {inline_data:{mime_type:'audio/wav',data:b64}},
      {text:'Is audio mein jo bola gaya hai use shabd ba shabd likho. Hindi ya Hinglish ho toh Roman script mein likho. Assistant ka naam "Arise" hai: agar ye naam bola gaya ho toh use hamesha "Arise" likho. Agar saaf insaani awaaz nahi hai (sirf shor, music ya adhoori awaaz) toh sirf NONE likho. Sirf transcript do, aur kuch nahi.'}
    ]}]}, modelList('gemini-flash-lite-latest'));
    return textOf(data);
  }

  async function startListener(once){
    if(L) return;
    if(!store.get('jv_key','')){ $('#settings').hidden = false; add('sys err','Pehle Settings mein Gemini API key daalo.'); hands = false; syncHands(); return; }
    var stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); }
    catch(e){ add('sys err','Mic nahi khula (' + (e.name || 'error') + '). Browser mein mic Allow karo.'); hands = false; syncHands(); statusIdle(); return; }
    if(L){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    var AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
    try{ if(ctx.state === 'suspended') await ctx.resume(); }catch(e){}
    var src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
    var rate = ctx.sampleRate, dur = 4096 / rate;
    var st = {stream:stream, ctx:ctx, src:src, proc:proc, once:once, chunks:[], pre:[], inSp:false, sil:0, len:0, speechT:0, nf:0.008, processing:false, dead:false, timer:null};
    L = st;
    proc.onaudioprocess = function(e){ if(!st.dead) onChunk(st, new Float32Array(e.inputBuffer.getChannelData(0)), rate, dur); };
    src.connect(proc); proc.connect(ctx.destination);
    setState('listening', once ? 'Bolo... (rukne par apne aap bhej dunga)' : 'Hands-free on: "Arise" bolo...');
    if(once){
      st.timer = setTimeout(function(){
        if(L === st && !st.inSp && !st.processing){ stopListener(); add('sys','Kuch sunai nahi diya. Orb dabake dobara bolo.'); statusIdle(); }
      }, 9000);
    }
  }
  function stopListener(){
    var st = L; if(!st) return;
    L = null; st.dead = true; clearTimeout(st.timer);
    try{ st.proc.disconnect(); st.src.disconnect(); }catch(e){}
    try{ st.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    try{ st.ctx.close(); }catch(e){}
    $('#lvlbar').style.width = '0';
  }
  function resetSeg(st){ st.chunks = []; st.pre = []; st.inSp = false; st.sil = 0; st.len = 0; st.speechT = 0; }
  function onChunk(st, d, rate, dur){
    var sum = 0, i;
    for(i=0;i<d.length;i++) sum += d[i] * d[i];
    var rms = Math.sqrt(sum / d.length);
    $('#lvlbar').style.width = Math.min(100, rms * 900) + '%';
    if(speaking || busy || st.processing || Date.now() < quietUntil || Date.now() < ringMute){ resetSeg(st); return; }
    var thr = Math.max(0.018, st.nf * 3.5), loud = rms > thr;
    if(!st.inSp){
      if(!loud){ st.nf = st.nf * 0.97 + rms * 0.03; st.pre.push(d); if(st.pre.length > 3) st.pre.shift(); return; }
      st.inSp = true; st.chunks = st.pre.slice(); st.pre = []; st.sil = 0; st.len = 0; st.speechT = 0;
    }
    st.chunks.push(d); st.len += dur;
    if(loud){ st.sil = 0; st.speechT += dur; } else st.sil += dur;
    if(st.sil > 0.9 || st.len > 12){
      var chunks = st.chunks, speechT = st.speechT;
      resetSeg(st);
      if(speechT < 0.3) return;
      segmentDone(st, chunks, rate);
    }
  }
  async function segmentDone(st, chunks, rate){
    clearTimeout(st.timer);
    var now = Date.now();
    calls = calls.filter(function(t){ return now - t < 60000; });
    if(calls.length >= 10){ setHeard('(bahut zyada awaaz, thoda ruk raha hoon)'); return; }
    calls.push(now);
    st.processing = true; setState('thinking','Samajh raha hoon...');
    var t = '';
    try{ t = await transcribe(toBase64(toWav16k(chunks, rate))); }
    catch(e){ st.processing = false; add('sys err', friendly(e)); if(st.once) stopListener(); statusIdle(); return; }
    st.processing = false;
    t = (t || '').trim();
    if(!t || /^none\b/i.test(t)){
      if(st.once){ stopListener(); add('sys','Awaaz saaf nahi aayi. Orb dabake dobara bolo.'); }
      statusIdle(); return;
    }
    setHeard(t);
    if(st.once){ stopListener(); handle(t); return; }
    statusIdle();
    routeTranscript(t);
  }

  /* ---------- alarms + battery ---------- */
  function fmtTime(ms){ return new Date(ms).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); }
  function parseClock(t){
    var m = String(t || '').trim().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?$/i);
    if(!m) return null;
    var h = +m[1], mi = +(m[2] || 0), ap = (m[3] || '').toLowerCase();
    if(ap === 'pm' && h < 12) h += 12;
    if(ap === 'am' && h === 12) h = 0;
    if(h > 23 || mi > 59) return null;
    var d = new Date(); d.setHours(h, mi, 0, 0);
    if(d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function saveAlarms(){ store.set('jv_alarms', JSON.stringify(alarms)); renderAlarms(); }
  function renderAlarms(){
    var parts = alarms.map(function(a){ return fmtTime(a.at) + ' (' + a.label + ')'; });
    if(battThr) parts.push('Battery ' + battThr + '%');
    $('#alarmlist').textContent = parts.length ? 'Alarms: ' + parts.join(', ') : '';
  }
  function startAlarm(label, secs){
    stopAlarm();
    ringing = {label:label, until:Date.now() + (secs || 300) * 1000, n:0, timer:null};
    $('#alarmtext').textContent = label; $('#alarmbar').hidden = false;
    add('ai','Alarm: ' + label + ' (band karne ke liye bolo "Arise, alarm band karo" ya button dabao)');
    ringTick(); ringing.timer = setInterval(ringTick, 4000);
  }
  function ringTick(){
    var r = ringing; if(!r) return;
    if(Date.now() > r.until){ stopAlarm(); add('sys','Alarm 5 minute baad apne aap band ho gaya.'); return; }
    ringMute = Date.now() + 1400;
    tone(3);
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    if(r.n % 4 === 0 && window.speechSynthesis && !speaking){
      try{
        var u = new SpeechSynthesisUtterance(r.label.replace(/[*_`#>]/g,''));
        u.lang = /[\u0900-\u097F]/.test(r.label) ? 'hi-IN' : 'en-IN';
        ringMute = Date.now() + Math.min(6000, 1500 + r.label.length * 90);
        speechSynthesis.speak(u);
      }catch(e){}
    }
    r.n++;
  }
  function stopAlarm(){
    var r = ringing; if(!r) return false;
    clearInterval(r.timer); ringing = null; ringMute = 0; $('#alarmbar').hidden = true;
    try{ speechSynthesis.cancel(); }catch(e){}
    return true;
  }
  function checkAlarms(){
    if(!alarms.length) return;
    var now = Date.now(), due = [], keep = [];
    alarms.forEach(function(a){ (a.at <= now ? due : keep).push(a); });
    if(!due.length) return;
    alarms = keep; saveAlarms();
    due.forEach(function(a){
      if(now - a.at > 10 * 60000) add('sys','Alarm miss ho gaya (page band tha): ' + a.label);
      else startAlarm(a.label, 300);
    });
  }
  async function initBattery(){
    if(batt) return true;
    if(!navigator.getBattery) return false;
    try{ batt = await navigator.getBattery(); }catch(e){ return false; }
    batt.addEventListener('levelchange', checkBattery); batt.addEventListener('chargingchange', checkBattery);
    setInterval(checkBattery, 30000);
    return true;
  }
  function checkBattery(){
    if(!batt || !battThr) return;
    var lvl = Math.round(batt.level * 100);
    if(batt.charging && lvl >= battThr){
      if(!battFired){ battFired = true; startAlarm('Charge ' + lvl + ' percent ho gaya. Charger nikal do.', 300); }
    } else if(!batt.charging || lvl < battThr - 1){ battFired = false; }
  }

  /* ---------- contacts ---------- */
  function renderContacts(){
    var c = getContacts(), box = $('#c-list'), ks = Object.keys(c);
    box.textContent = '';
    ks.forEach(function(k){
      var row = document.createElement('div'); row.className = 'citem';
      var sp = document.createElement('span'); sp.textContent = k + ': +' + c[k];
      var b = document.createElement('button'); b.type = 'button'; b.className = 'ghost'; b.textContent = 'Hatao'; b.setAttribute('data-k', k);
      row.appendChild(sp); row.appendChild(b); box.appendChild(row);
    });
    if(!ks.length) box.textContent = 'Abhi koi contact nahi.';
  }

  /* ---------- hands-free + settings ---------- */
  function syncHands(){
    var b = $('#hands'); b.textContent = 'Hands-free: ' + (hands ? 'ON' : 'OFF'); b.setAttribute('aria-pressed', hands ? 'true' : 'false');
  }
  function getWake(){
    try{
      if(navigator.wakeLock && !wakeLock){
        navigator.wakeLock.request('screen').then(function(w){ wakeLock = w; w.addEventListener('release', function(){ wakeLock = null; }); }, function(){});
      }
    }catch(e){}
  }
  async function toggleHands(){
    hands = !hands; syncHands(); unlockSpeech();
    if(hands){
      getWake();
      add('sys','Hands-free on. Bolo: "Arise, YouTube pe gaane chalao". Is page ko khula aur screen on rakho. Video chalate waqt headphones lagao.');
      if(recMode()) startListener(false); else startRec(true);
    } else {
      stopRec(); stopListener();
      try{ if(wakeLock) wakeLock.release(); }catch(e){} wakeLock = null;
      statusIdle();
    }
  }
  function loadSettings(){
    $('#key').value = store.get('jv_key',''); $('#model').value = store.get('jv_model', DEFAULT_MODEL);
    $('#ytkey').value = store.get('jv_ytkey',''); $('#lang').value = store.get('jv_lang','hi-IN');
    $('#speak').checked = store.get('jv_speak','1') === '1'; $('#rec').checked = recMode();
    $('#duck').checked = store.get('jv_duck','1') === '1'; renderContacts();
  }
  function saveSettings(){
    store.set('jv_key', $('#key').value.trim()); store.set('jv_model', $('#model').value.trim() || DEFAULT_MODEL);
    store.set('jv_ytkey', $('#ytkey').value.trim()); store.set('jv_lang', $('#lang').value);
    store.set('jv_speak', $('#speak').checked ? '1' : '0'); store.set('jv_record', $('#rec').checked ? '1' : '0'); store.set('jv_duck', $('#duck').checked ? '1' : '0');
    $('#settings').hidden = true; idleOrHands();
  }

  $('#orb').addEventListener('click', function(){
    unlockSpeech();
    if(speaking){ try{ speechSynthesis.cancel(); }catch(e){} return; }
    if(hands){ awaitUntil = Date.now() + 8000; ding(); setState('listening','Haan bolo...'); return; }
    if(recMode()){ if(L){ stopListener(); statusIdle(); return; } startListener(true); return; }
    if(document.body.dataset.state === 'listening' && rec){ try{ rec.stop(); }catch(e){} return; }
    startRec(false);
  });
  $('#hands').addEventListener('click', toggleHands);
  $('#form').addEventListener('submit', function(e){ e.preventDefault(); unlockSpeech(); var v = $('#text').value; $('#text').value = ''; handle(v); });
  $('#open-settings').addEventListener('click', function(){ loadSettings(); $('#settings').hidden = false; });
  $('#save').addEventListener('click', saveSettings);
  $('#clear').addEventListener('click', function(){ history = []; $('#log').textContent = ''; add('sys','Chat saaf ho gayi.'); $('#settings').hidden = true; });
  $('#clear-mem').addEventListener('click', function(){ store.set('jv_profile','[]'); add('sys','Yaaddasht saaf ho gayi.'); $('#settings').hidden = true; });
  $('#v-play').addEventListener('click', function(){ vc(function(p){ if(p.getPlayerState() === 1) p.pauseVideo(); else p.playVideo(); }); });
  $('#v-back').addEventListener('click', function(){ vc(function(p){ p.seekTo(Math.max(0, p.getCurrentTime() - 10), true); }); });
  $('#v-fwd').addEventListener('click', function(){ vc(function(p){ p.seekTo(p.getCurrentTime() + 10, true); }); });
  $('#v-sound').addEventListener('click', function(){ vc(function(p){ p.unMute(); p.playVideo(); }); });
  $('#v-close').addEventListener('click', closeVideo);
  $('#alarm-stop').addEventListener('click', function(){ stopAlarm(); statusIdle(); });
  $('#c-add').addEventListener('click', function(){
    var name = $('#c-name').value.trim().toLowerCase(), num = normNum($('#c-num').value);
    if(!name || !num){ $('#c-msg').textContent = 'Naam aur poora number (10 digit) daalo.'; return; }
    var c = getContacts(); c[name] = num; store.set('jv_contacts', JSON.stringify(c));
    $('#c-name').value = ''; $('#c-num').value = ''; $('#c-msg').textContent = name + ' save ho gaya.'; renderContacts();
  });
  $('#c-list').addEventListener('click', function(e){
    var k = e.target && e.target.getAttribute && e.target.getAttribute('data-k');
    if(!k) return;
    var c = getContacts(); delete c[k]; store.set('jv_contacts', JSON.stringify(c)); renderContacts();
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && hands){ getWake(); if(recMode() && !L) startListener(false); }
  });

  [
    'MrBeast ka sabse viral video chalao',
    'T-Series ka latest video chalao',
    'Chai pe 30 second ka Shorts script likho',
    'Aaj ka cricket score kya hai',
    'Delhi ka mausam batao',
    '10 minute ka timer lagao',
    'Yaad rakhna kal doodh lana hai',
    'Mummy ka number 9876543210 save karo',
    'Mummy ko WhatsApp pe bolo main late aaunga',
    '250 ka 18 percent kitna hua'
  ].forEach(function(t){
    var c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = t;
    c.addEventListener('click', function(){ unlockSpeech(); handle(t); }); $('#chips').appendChild(c);
  });

  if(window.speechSynthesis){ speechSynthesis.getVoices(); }
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  alarms = jget('jv_alarms', []); if(!Array.isArray(alarms)) alarms = [];
  checkAlarms(); renderAlarms(); setInterval(checkAlarms, 1000);
  if(battThr) initBattery().then(function(ok){ if(ok) getWake(); renderAlarms(); });
  loadSettings();
  add('sys','Namaste, main Arise hoon. "Hands-free" ON karke bolo: "Arise, MrBeast ka sabse viral video chalao". Ya orb dabao, ya type karo.');
  if(!store.get('jv_key','')) $('#settings').hidden = false;
})();
